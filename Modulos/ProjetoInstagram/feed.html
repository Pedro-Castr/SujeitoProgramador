<!DOCTYPE html>
<html lang="pt-br">
<head>

      </div>
      <div class="postagem">
        <img src="https://sujeitoprogramador.com/instareact/foto3.png" alt="Postagem do Usuário">

          <a href="#">Curtir</a>
          <a href="#">Repostar</a>
        </div>
      </div>
    </div>

    <div class="post">

      </div>

          <a href="#">Curtir</a>
          <a href="#">Repostar</a>

    <div class="post">
      <div class="perfil">

      </div>
      <div class="postagem">
        <img src="https://sujeitoprogramador.com/instareact/foto1.png" alt="Postagem do Usuário">
        <div class="links">
          <a href="#">Curtir</a>
          <a href="#">Repostar</a>
        </div>
      </div>
    </div>
